name: Validation control plane
on:
  pull_request:
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'workflows/**'
      - 'contracts/**'
      - 'catalog/**'
      - 'gateways/**'
      - 'validation_workforce/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install jsonschema pyyaml
      - run: ./scripts/check-divisions.sh
      - run: ./scripts/check-tools.sh
      - run: python3 scripts/validate-contracts.py
      - run: PYTHONPATH=. ./scripts/workforce.py catalog-validate
      - run: PYTHONPATH=. ./scripts/workforce.py workflow validate
      - run: python3 scripts/check-hermes-plugin.py
      - run: PYTHONPATH=. python3 -m unittest discover -s tests -v
      - run: git diff --check
