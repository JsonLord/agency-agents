name: Lint Agent Files
on:
  pull_request:
    paths:
      - 'agents/discovery/**'
      - 'agents/intelligence/**'
      - 'agents/hypothesis/**'
      - 'agents/proposition/**'
      - 'agents/experimentation/**'
      - 'agents/distribution/**'
      - 'agents/production/**'
      - 'agents/evaluation/**'
      - 'agents/decision/**'
      - 'scripts/lint-agents.sh'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          FILES=$(git diff --name-only HEAD^ HEAD -- 'agents/discovery/*.md' 'agents/intelligence/*.md' 'agents/hypothesis/*.md' 'agents/proposition/*.md' 'agents/experimentation/*.md' 'agents/distribution/*.md' 'agents/production/*.md' 'agents/evaluation/*.md' 'agents/decision/*.md')
          test -z "$FILES" || ./scripts/lint-agents.sh $FILES
